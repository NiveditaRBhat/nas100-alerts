name: Backtest

on:
  push:
    branches: [main]
    paths: ["signals.py", "backtest.py", ".github/workflows/backtest.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest.py
      - name: Save results
        run: |
          git config user.name "nas100-bot"
          git config user.email "nas100-bot@users.noreply.github.com"
          git add BACKTEST.md
          git diff --cached --quiet || (git commit -q -m "backtest results" && git pull -q --rebase && git push -q)
