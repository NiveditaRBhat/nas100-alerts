name: NAS100 alerts

on:
  schedule:
    # Every 5 minutes, Sunday evening to Friday night (UTC). GitHub may run a few minutes late.
    - cron: "*/5 * * * 0-5"
  push:
    branches: [main]
    paths: ["monitor.py", ".github/workflows/monitor.yml"]
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false

env:
  # Your ntfy topic. Subscribe to this exact name in the ntfy app.
  # (A NTFY_TOPIC repository secret, if you add one, takes priority.)
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'niv-nas100-dff2840e' }}

permissions:
  contents: write

concurrency:
  group: nas100-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send test notification
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test) }}
        run: python monitor.py --test

      - name: Check market and alert
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test) }}
        env:
          ACTIVE_HOURS_DUBAI: ${{ vars.ACTIVE_HOURS_DUBAI || '0-24' }}
        run: python monitor.py

      - name: Save state
        run: |
          git config user.name "nas100-bot"
          git config user.email "nas100-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
